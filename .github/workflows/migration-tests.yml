name: Legacy helper migration tests

on:
  push:
  pull_request:

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run migration tests
        run: python -m unittest discover -s tests -p test_legacy.py -v
