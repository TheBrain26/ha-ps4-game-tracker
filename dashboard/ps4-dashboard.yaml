# Öffentliche Vorlage: media_player.deine_ps4 ersetzen.
# Tracker-IDs mit den tatsächlich angelegten Entitäten abgleichen.
# Trophäen-Sensoren ersetzen oder den letzten Grid-Block entfernen.
type: custom:vertical-stack-in-card
cards:
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.ps4_game_tracker_spiel_aktiv
    state_not: 'on'
  card:
    type: picture
    image: /ps4_game_tracker/ps4_platzhalter.png
    aspect_ratio: '16:9'
    card_mod:
      style: 'ha-card { background: transparent !important; border: none !important; box-shadow: none !important;
        border-radius: 10px !important; overflow: hidden !important; }'
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.ps4_game_tracker_spiel_aktiv
    state: 'on'
  card:
    type: markdown
    content: |-
      {% set cover = state_attr('media_player.deine_ps4', 'entity_picture') %}
      <img src="{{ cover or '/ps4_game_tracker/ps4_platzhalter.png' }}" style="width:100%;height:250px;object-fit:cover;border-radius:10px;display:block;">
    card_mod:
      style: 'ha-card { background: transparent !important; border: none !important; box-shadow: none !important;
        border-radius: 10px !important; overflow: hidden !important; }'
    entity_id:
    - media_player.deine_ps4
- type: custom:mushroom-template-card
  entity: binary_sensor.ps4_game_tracker_spiel_aktiv
  primary: '{{ (state_attr(''media_player.deine_ps4'', ''media_title'') or ''PlayStation 4'') if is_state(''binary_sensor.ps4_game_tracker_spiel_aktiv'',
    ''on'') else ''PlayStation 4'' }}'
  secondary: '{{ ''Spiel aktiv'' if is_state(''binary_sensor.ps4_game_tracker_spiel_aktiv'', ''on'') else ''Kein
    Spiel aktiv'' if is_state(''binary_sensor.ps4_game_tracker_spiel_aktiv'', ''off'') else ''Spielstatus nicht
    verfügbar'' }}'
  icon: mdi:sony-playstation
  icon_color: '{{ ''blue'' if is_state(''binary_sensor.ps4_game_tracker_spiel_aktiv'', ''on'') else ''grey'' }}'
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  primary: Spielzeit
  secondary: 'Heute: {{ states(''sensor.ps4_game_tracker_spielzeit_heute'') | int(0) }} min · Woche: {{ states(''sensor.ps4_game_tracker_spielzeit_woche'')
    | int(0) }} min · Monat: {{ states(''sensor.ps4_game_tracker_spielzeit_monat'') | int(0) }} min · Jahr: {{ states(''sensor.ps4_game_tracker_spielzeit_jahr'')
    | int(0) }} min'
  icon: mdi:chart-line
  icon_color: blue
  multiline_secondary: true
  entity: sensor.ps4_game_tracker_spielzeit_heute
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.ps4_game_tracker_letzte_spieldauer
  icon: mdi:timer-outline
  icon_color: purple
  primary: Letzte Spieldauer
  secondary: '{{ states(''sensor.ps4_game_tracker_letzte_spieldauer'') | int(0) }} min'
  tap_action:
    action: more-info
- type: custom:mushroom-entity-card
  entity: sensor.ps4_game_tracker_letztes_spiel
  name: Letztes Spiel
  icon: mdi:gamepad-variant
  icon_color: blue
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  primary: Spielverlauf
  secondary: |-
    {% set sessions = state_attr('sensor.ps4_game_tracker_spielverlauf', 'sessions') or [] %}
    {% set ns = namespace(entries=[]) %}
    {% for session in sessions[-5:] | reverse %}
      {% set end = as_timestamp(session['end'], none) %}
      {% set time = (end | timestamp_custom('%H:%M', true)) if end is not none else '' %}
      {% set ns.entries = ns.entries + [session['title'] ~ ' · ' ~ (session['minutes'] | int(0)) ~ ' min · ' ~ time] %}
    {% endfor %}
    {% if ns.entries %}
      {{ ns.entries | join(' | ') }}
    {% else %}
      {% set history = state_attr('sensor.ps4_game_tracker_spielverlauf', 'legacy_history') or '' %}
      {{ history.split('|')[:5] | map('trim') | join(' | ') if history else 'Noch keine Spielsitzungen erfasst.' }}
    {% endif %}
  icon: mdi:history
  icon_color: orange
  entity: sensor.ps4_game_tracker_spielverlauf
  multiline_secondary: true
  tap_action:
    action: more-info
- type: grid
  columns: 4
  square: false
  cards:
  - type: custom:mushroom-template-card
    primary: '{{ states(''sensor.deine_ps4_platin_trophaen'') }}'
    secondary: Platin
    icon: mdi:trophy-variant
    icon_color: grey
    layout: vertical
  - type: custom:mushroom-template-card
    primary: '{{ states(''sensor.deine_ps4_gold_trophaen'') }}'
    secondary: Gold
    icon: mdi:trophy
    icon_color: amber
    layout: vertical
  - type: custom:mushroom-template-card
    primary: '{{ states(''sensor.deine_ps4_silber_trophaen'') }}'
    secondary: Silber
    icon: mdi:trophy
    icon_color: grey
    layout: vertical
  - type: custom:mushroom-template-card
    primary: '{{ states(''sensor.deine_ps4_bronze_trophaen'') }}'
    secondary: Bronze
    icon: mdi:trophy
    icon_color: deep-orange
    layout: vertical
card_mod:
  style: |
    ha-card {
      border-radius: 16px !important;
      overflow: hidden !important;
    }
grid_options:
  columns: 12
  rows: auto
